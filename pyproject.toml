[project]
name = "memnode"
version = "0.0.1"
description = "memnode: Python implementation of the memcloud distributed RAM pool daemon"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
    "cryptography>=41.0",
    "zeroconf>=0.130",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
